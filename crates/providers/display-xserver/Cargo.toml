[package]
name = "display-xserver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session Xvfb and RFB server launched only through the bound world's Subprocess"

[dependencies]
aho-cap = { path = "../../aho-cap", version = "0.0.1" }
aho-display = { path = "../../seams/aho-display", version = "0.0.1" }
aho-proc = { path = "../../seams/aho-proc", version = "0.0.1" }
vm-rfb = { path = "../vm-rfb", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "time"] }

[lints]
workspace = true
