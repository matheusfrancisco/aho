[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`aho serve`: one process owns every session, thin clients attach over a unix socket (NDJSON); takeover, crash detection, reload by exec-in-place with a readiness fd (12)"

[[bin]]
name = "daemon-ready-probe"
path = "src/bin/ready_probe.rs"

[dependencies]
aho-types.workspace = true
aho-log.workspace = true
aho-session.workspace = true
aho-approval.workspace = true
aho-policy.workspace = true
# `SessionEvent::Stream` carries `aho_llm::StreamEvent`, which has no serde impl: projecting it
# onto the wire needs its variants.
aho-llm.workspace = true
# `approval.request` carries the card fields every surface renders (reason label, preset cut).
surface-print = { path = "../../surfaces/surface-print" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
aho-cap.workspace = true
aho-config.workspace = true
llm-scripted = { path = "../llm-scripted" }
aho-control = { path = "../../seams/aho-control" }
session-drive = { path = "../session-drive" }

[lints]
workspace = true
