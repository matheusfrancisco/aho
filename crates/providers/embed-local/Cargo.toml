[package]
name = "embed-local"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local lexical or optional ONNX MiniLM embeddings, bounded cache and idle unloading"

[features]
default = []
minilm = ["dep:ort", "dep:libloading", "dep:tokenizers", "dep:sha2", "dep:sha1", "dep:lru", "dep:reqwest", "dep:tempfile", "dep:libc", "dep:serde"]

[dependencies]
aho-types.workspace = true
aho-cap.workspace = true
aho-config.workspace = true
aho-embed.workspace = true
aho-log.workspace = true
serde_json.workspace = true
tokio.workspace = true
serde = { workspace = true, optional = true }
# api-23: ONNX Runtime 1.22.0 segfaults creating a session (PreferNpuEpPolicy null deref); ort then
# refuses older runtimes with an error instead of loading them.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-23"], optional = true }
# Version preflight (minilm.rs): ort deadlocks instead of erroring on a too-old runtime.
libloading = { version = "0.9", optional = true }
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"], optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
lru = { version = "0.16", default-features = false, optional = true }
reqwest = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[lints]
workspace = true


[[example]]
name = "minilm-smoke"
required-features = ["minilm"]
