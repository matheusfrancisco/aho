\* Session-scoped jobs on a smaller loop: two calls, two ops, a lease of one running job.
CONSTANT Calls = {"c1", "c2"}
CONSTANT Ops = {1, 2}
CONSTANT MaxQueued = 1
CONSTANT MaxSince = 4
CONSTANT MaxJobs = 1
INIT Init
NEXT Next
CONSTRAINT Bound
INVARIANT TypeOK
INVARIANT NoInjectionBetweenCallAndResult
INVARIANT IdleIffNothingPending
INVARIANT NoRequestDuringGrace
INVARIANT JobEndsOnce
INVARIANT NoDeliveryAfterCancel
INVARIANT NoDeliveryBetweenCallAndResult
INVARIANT JobWithinLease
