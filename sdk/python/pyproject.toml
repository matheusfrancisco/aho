[project]
name = "aho-sdk"
version = "0.0.1"
description = "Thin asyncio client for `aho rpc` (stdio NDJSON), generated from the aho rpc protocol table"
license = "MIT"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aho_sdk"]
