name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # The repo's own gate: fmt, clippy -D warnings, ambient-authority audit,
    # ratchets, and the layer guard. One script locally and in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        # gate scripts need stdlib Python 3.11+ only, which the runner has.
      - name: gate
        run: scripts/gate.sh

  tests:
    # The workspace test suite, minus the packages whose custom test harnesses do
    # not implement the libtest listing protocol nextest requires; those run
    # after with cargo test. The ci profile fails slow, cancels nothing on the
    # first failure, and retries only the tests listed in .config/nextest.toml
    # (each retry is reported, so flakes stay visible).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install rust-analyzer (tool-lsp integration tests)
        run: rustup component add rust-analyzer
      - name: workspace tests (nextest)
        run: cargo nextest run --workspace --exclude subagent-acp --profile ci
      - name: custom-harness tests (cargo test)
        run: cargo test -p subagent-acp --test stdio && cargo test --workspace --doc